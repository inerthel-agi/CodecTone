name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AudioConverter.sln

      - name: Build
        run: dotnet build AudioConverter.sln -c Release --no-restore

      # FFmpeg is not installed on the runner, so FFmpeg integration tests report as skipped (Inconclusive).
      # The preview playback test is also skipped when the runner has no audio device.
      - name: Test
        run: dotnet test AudioConverter.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx

      # Screenshots of every page in every theme, rendered by WorkspaceTests; useful to review UI changes in a PR.
      - name: Upload layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-captures
          path: tests/AudioConverter.Desktop.Tests/bin/Release/net8.0-windows/*.png
          if-no-files-found: ignore
